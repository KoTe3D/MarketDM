spring:
  security:
    # Отключение auto-generated пароля (в dev)
    user:
      name: admin
      password: ${ADMIN_PASSWORD:d112130}
      roles: ADMIN

  # Настройки для JWT
  jwt:
    secret: ${JWT_SECRET:mySuperSecretKeyThatIsVeryLongAndSecure123!}
    expiration: 86400000  # 24 часа в миллисекундах

  # Настройки OAuth2
  oauth2:
    client:
      registration:
        google:
          client-id: ${GOOGLE_CLIENT_ID}
          client-secret: ${GOOGLE_CLIENT_SECRET}
        github:
          client-id: ${GITHUB_CLIENT_ID}
          client-secret: ${GITHUB_CLIENT_SECRET}

  # Настройки базы данных
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:112130}

  # Настройки загрузки файлов
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Кастомные настройки приложения
app:
  security:
    allowed-origins:
      - "http://localhost:3000"
      - "https://myapp.com"
    token-expiration-days: 7
    password-reset-expiration-minutes: 30