
# Production Profile

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=112130

# HikariCP Pool (\u043E\u043F\u0442\u0438\u043C\u0438\u0437\u0430\u0446\u0438\u044F \u043F\u043E\u0434 \u043D\u0430\u0433\u0440\u0443\u0437\u043A\u0443)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=MarketDM-Pool

# \u0421\u0442\u0440\u043E\u0433\u0430\u044F \u0432\u0430\u043B\u0438\u0434\u0430\u0446\u0438\u044F \u0441\u0445\u0435\u043C\u044B (create-drop \u0434\u043B\u044F \u043E\u0447\u0438\u0441\u0442\u043A\u0438 \u043F\u0435\u0440\u0435\u0434 \u0437\u0430\u043F\u0443\u0441\u043A\u043E\u043C)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# \u041B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 (\u043E\u0441\u043D\u043E\u0432\u043D\u044B\u0435 \u0432\u0430\u0436\u043D\u044B\u0435 \u0441\u043E\u0431\u044B\u0442\u0438\u044F)
logging.level.root=WARN
logging.level.com.MarketDM=INFO
logging.level.org.springframework.security=INFO