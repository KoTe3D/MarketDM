
# MarketDM - Base Configuration

spring.application.name=MarketDM
server.port=8080
server.shutdown=graceful

# \u0410\u043A\u0442\u0438\u0432\u043D\u044B\u0439 \u043F\u0440\u043E\u0444\u0438\u043B\u044C (\u043F\u043E \u0443\u043C\u043E\u043B\u0447\u0430\u043D\u0438\u044E: dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA/Hibernate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# \u0417\u0430\u0433\u0440\u0443\u0437\u043A\u0430 \u0444\u0430\u0439\u043B\u043E\u0432
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# \u041F\u0430\u043F\u043A\u0430 \u0437\u0430\u0433\u0440\u0443\u0437\u043E\u043A (\u043E\u0442\u043D\u043E\u0441\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0439 \u043F\u0443\u0442\u044C \u0438\u043B\u0438 \u0438\u0437 \u043F\u0435\u0440\u0435\u043C\u0435\u043D\u043D\u043E\u0439 \u043E\u043A\u0440\u0443\u0436\u0435\u043D\u0438\u044F)
app.upload-dir=${UPLOAD_DIR:./uploads}

# Security & JWT
app.security.remember-me.key=${REMEMBER_ME_SECRET:dev-remember-me-key}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
app.security.allowed-origins[0]=http://localhost:3000
app.security.allowed-origins[1]=https://myapp.com
app.security.token-expiration-days=7
app.security.password-reset-expiration-minutes=30

# OAuth2 (ID/Secret \u0432\u0441\u0435\u0433\u0434\u0430 \u0438\u0437 \u043F\u0435\u0440\u0435\u043C\u0435\u043D\u043D\u044B\u0445 \u043E\u043A\u0440\u0443\u0436\u0435\u043D\u0438\u044F)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

# Actuator (\u043C\u043E\u043D\u0438\u0442\u043E\u0440\u0438\u043D\u0433)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized