<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; }
        input { display: block; width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #45a049; }
        #result { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; word-break: break-word; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
        .info { font-size: 14px; margin-top: 10px; text-align: center; }
        .info a { color: #4CAF50; text-decoration: none; }
        .info a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h2>Вход в систему</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
    <div id="result"></div>
    <div class="info">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const data = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'none';
        resultDiv.className = '';

        try {
            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const responseData = await response.json();
                // Предполагаем, что ответ содержит поле token (как в JwtResponseDto)
                const token = responseData.token;
                resultDiv.innerHTML = `<div class="success">✅ Успешный вход!</div>`;
                resultDiv.className = 'success';
                // Сохраняем токен в localStorage (можно использовать для авторизованных запросов)
                localStorage.setItem('jwt', token);
                // Опционально: перенаправить на главную через пару секунд
                window.location.href = '/';
            } else {
                let errorText = `❌ Ошибка ${response.status}`;
                try {
                    const errorData = await response.json();
                    errorText = errorData.message || errorData.error || JSON.stringify(errorData);
                } catch {
                    errorText = await response.text() || errorText;
                }
                resultDiv.innerHTML = `<div class="error">${errorText}</div>`;
                resultDiv.className = 'error';
            }
        } catch (err) {
            resultDiv.innerHTML = `<div class="error">❌ Ошибка соединения с сервером</div>`;
            resultDiv.className = 'error';
        }
        resultDiv.style.display = 'block';
    });
</script>
</body>
</html>
