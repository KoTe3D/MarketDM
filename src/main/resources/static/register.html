<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; }
        input { display: block; width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #45a049; }
        #result { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
    </style>
</head>
<body>
<div class="container">
    <h2>Регистрация нового пользователя</h2>
    <form id="registerForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Пароль (мин. 6 символов)" required>
        <input type="text" id="firstName" placeholder="Имя" required>
        <input type="text" id="lastName" placeholder="Фамилия" required>
        <button type="submit">Зарегистрироваться</button>
    </form>
    <div id="result"></div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const data = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value
        };

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'none'; // скрываем предыдущий результат
        resultDiv.className = ''; // сбрасываем класс

        try {
            // ✅ ИСПРАВЛЕННЫЙ URL
            const response = await fetch('/api/v1/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const user = await response.json();
                resultDiv.innerHTML = `<div class="success">✅ Пользователь успешно создан! </div>`;
                resultDiv.className = 'success';
                document.getElementById('registerForm').reset(); // очистить форму
            } else {
                // Попробуем получить текст ошибки (может быть JSON с message)
                let errorText = `❌ Ошибка ${response.status}`;
                try {
                    const errorData = await response.json();
                    errorText = errorData.message || errorData.error || JSON.stringify(errorData);
                } catch {
                    // если не JSON, читаем как текст
                    errorText = await response.text() || errorText;
                }
                resultDiv.innerHTML = `<div class="error">${errorText}</div>`;
                resultDiv.className = 'error';
            }
        } catch (err) {
            resultDiv.innerHTML = `<div class="error">❌ Ошибка соединения с сервером</div>`;
            resultDiv.className = 'error';
        }
        resultDiv.style.display = 'block';
    });
</script>
</body>
</html>
