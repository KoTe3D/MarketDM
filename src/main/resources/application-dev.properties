
# Development Profile

# PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=112130

# jwt
jwt.secret=${JWT_SECRET:mySuperSecretKeyThatIsVeryLongAndSecure123!}
jwt.expiration-ms=86400000

# \u0410\u0432\u0442\u043E-\u0441\u043E\u0437\u0434\u0430\u043D\u0438\u0435 \u0441\u0445\u0435\u043C\u044B (\u0431\u0435\u0437\u043E\u043F\u0430\u0441\u043D\u043E \u0442\u043E\u043B\u044C\u043A\u043E \u0434\u043B\u044F DEV)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# \u0414\u0435\u0444\u043E\u043B\u0442\u043D\u044B\u0439 \u0430\u0434\u043C\u0438\u043D \u0434\u043B\u044F \u043B\u043E\u043A\u0430\u043B\u044C\u043D\u044B\u0445 \u0442\u0435\u0441\u0442\u043E\u0432
spring.security.user.name=springslogin
spring.security.user.password=${ADMIN_PASSWORD:springspassword}
spring.security.user.roles=ADMIN

# \u041B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435
logging.level.root=INFO
logging.level.com.MarketDM=DEBUG
logging.level.org.springframework.security=DEBUG